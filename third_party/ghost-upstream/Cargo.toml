[package]
name = "ghost"
version = "0.8.0"
edition = "2021"
description = "Standalone GUI shell with built-in file management, text processing, networking, and seek"

[dependencies]
eframe = "0.29"
egui = "0.29"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
suppaftp = "5"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
tar = "0.4"
flate2 = "1"
zip = "2"
portable-pty = "0.8"
vt100 = "0.16"
syntect = "5"

[profile.release]
opt-level = 3
