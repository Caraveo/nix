name: Core QEMU integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  boot-and-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install freestanding build and emulator tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86
      - name: Boot and test Core
        run: python3 tests/smoke.py && python3 tests/power.py && python3 tests/phase4.py && python3 tests/intent.py && python3 tests/asm.py
      - uses: actions/upload-artifact@v4
        with:
          name: nix-core-kernel-and-capture
          path: |
            build/core.elf
            build/*.ppm
